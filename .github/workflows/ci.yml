name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: business-platform-api/package.json
      - name: Install dependencies
        run: npm ci
        working-directory: business-platform-api
      - name: Prisma generate
        run: npx prisma generate
        working-directory: business-platform-api
      - name: Lint
        run: npm run lint
        working-directory: business-platform-api
      - name: Build
        run: npm run build
        working-directory: business-platform-api
      - name: Test
        run: npm test
        working-directory: business-platform-api
